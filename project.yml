name: LivePhotoMaker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  LivePhotoMaker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LivePhotoMaker
    settings:
      base:
        PRODUCT_NAME: LivePhotoMaker
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livephotomaker
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "实况合成"
        # 读取权限：App 会用 PhotoKit 读取刚写入的 PHAsset 做「是不是实况照片」的校验，
        # 并允许用户在系统设置里授予完整相册访问权限。缺这条会导致真机请求/访问相册时崩溃。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要读取相册以确认合成的实况照片已正确保存。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于将合成后的实况照片保存到你的系统相册。"
        # 关键：UIDocumentPickerViewController(asCopy:false) 选择「文件夹」必须开启 open-in-place，
        # 缺这两个键时系统文件选择器里的文件夹会变为不可选（灰显/无法进入），导致"选不了文件夹"。
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  LivePhotoMaker:
    build:
      targets:
        LivePhotoMaker: all
    run:
      config: Debug
    archive:
      config: Release
